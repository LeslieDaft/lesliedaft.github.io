<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Magnet Panic · Daft Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e19;color:#eefaff;font:15px system-ui;overflow:hidden;touch-action:none}button,a{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #376478;background:#10283a;border-radius:12px;padding:14px 22px}button:hover{background:#204c5b}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #243347}header a{text-decoration:none;color:#87b0bc}header b{letter-spacing:2px;color:#7af5df}canvas{display:block;width:100%;height:calc(100dvh - 64px)}.overlay{position:absolute;inset:64px 0 0;display:flex;align-items:center;justify-content:center;background:#050c18b8;backdrop-filter:blur(6px);padding:22px}.panel{max-width:620px;width:100%;text-align:center;background:#101d30;border:1px solid #345166;border-radius:24px;padding:32px;box-shadow:0 20px 80px #0006}h1{font-size:clamp(35px,8vw,64px);line-height:.95;letter-spacing:-3px;margin:10px 0 20px}h1 span{color:#7af5df}p{color:#a9c2cf;line-height:1.6}.tag{color:#fdb372;letter-spacing:3px;font-size:12px}.choices{display:grid;gap:10px}.choices button{text-align:left}.choices small{display:block;color:#adc0cc;margin-top:5px}.hidden{display:none!important}#hud{position:absolute;top:80px;left:20px;right:20px;pointer-events:none;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 4px #000}#hint{position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#88a8b7;pointer-events:none;font-size:12px}#blast{position:absolute;right:24px;bottom:35px;width:100px;height:100px;border-radius:50%;border:2px solid #7af5df;background:#153844cc;display:none;user-select:none}#pause{padding:8px 12px} @media(pointer:coarse){#blast{display:block}#hint{bottom:8px}}
</style><header><a href="../">← Arcade</a><b>MAGNET PANIC</b><button id="pause">Pause</button></header><canvas id="game"></canvas><div id="hud"><span id="stats"></span><span id="record"></span></div><div id="hint">WASD / arrows to move · Hold Space to pull · Release to blast · P to pause</div><button id="blast">HOLD<br>TO PULL</button><div id="overlay" class="overlay"><div id="panel" class="panel"></div></div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),stats=document.getElementById('stats'),record=document.getElementById('record'),keys=new Set();
const W=1100,H=720;let state='menu',p,junk,enemies,fx,time,score,kills,level,xp,needed,spawn,supply,pulling=false,charge=0,shake=0,last=0,best=0,choices=[],audio,stick=null,touch={x:0,y:0};
try{best=+localStorage.getItem('magnet-panic-best')||0}catch{}
const upgrades=[['Wide field','Pull range +25%',()=>p.range*=1.25],['Heavy metal','Scrap damage +35%',()=>p.damage*=1.35],['Fast feet','Move speed +18%',()=>p.speed*=1.18],['Repair kit','Heal 35; max health +15',()=>{p.max+=15;p.hp=Math.min(p.max,p.hp+35)}],['Scrap swarm','Carry four more pieces',()=>p.capacity+=4],['Hot coils','Charge 30% faster',()=>p.coils*=1.3],['Orbit shield','Orbiting scrap also hurts enemies',()=>p.shield+=12]];
function sound(f,d=.08){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.45,audio.currentTime+d);g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function screen(html){panel.innerHTML=html;overlay.classList.remove('hidden')}
function menu(){screen('<div class="tag">PULL. RELEASE. SURVIVE.</div><h1>MAGNET<br><span>PANIC</span></h1><p>Gather flying scrap into an orbit. Release a metal storm to smash the swarm. Hold too long and loose scrap can hit you!</p><p><b>Move:</b> WASD / arrows<br><b>Pull:</b> hold Space · <b>Blast:</b> release Space<br>Touch: drag the left side + hold the right button.</p><button onclick="start()">Start the panic →</button><p>Best score: '+best+'</p>')}
function start(){p={x:W/2,y:H/2,hp:100,max:100,speed:235,range:220,damage:24,capacity:12,coils:1,shield:0,inv:0};junk=[];enemies=[];fx=[];time=score=kills=xp=0;level=1;needed=7;spawn=.8;supply=0;charge=0;pulling=false;shake=0;keys.clear();touch={x:0,y:0};state='play';for(let i=0;i<26;i++)scrap();overlay.classList.add('hidden');sound(550)}
function scrap(){let a=Math.random()*Math.PI*2;junk.push({x:35+Math.random()*(W-70),y:35+Math.random()*(H-70),vx:Math.cos(a)*30,vy:Math.sin(a)*30,a,spin:(Math.random()-.5)*5,mode:'loose',life:30,cool:0})}
function enemy(){let side=Math.floor(Math.random()*4),heavy=time>25&&Math.random()<.22,fast=time>12&&Math.random()<.25;enemies.push({x:side===0?-25:side===1?W+25:Math.random()*W,y:side===2?-25:side===3?H+25:Math.random()*H,r:heavy?24:fast?11:16,hp:heavy?100:fast?24:42,speed:(heavy?42:fast?117:68)+Math.min(65,time*.45),heavy,fast,cool:0})}
function burst(x,y,c,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=40+Math.random()*220;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.3,c})}}
function hold(){if(state==='play'){pulling=true;sound(230)}}
function release(){if(!pulling)return;pulling=false;if(state!=='play')return;let ammo=junk.filter(j=>j.mode==='orbit');for(const j of junk){if(j.mode==='orbit'||j.mode==='loose'&&Math.hypot(j.x-p.x,j.y-p.y)<p.range){let a=Math.atan2(j.y-p.y,j.x-p.x);j.vx=Math.cos(a)*(520+charge*360);j.vy=Math.sin(a)*(520+charge*360);j.mode='shot';j.life=2.4;j.power=p.damage*(1+charge*.8)}}if(ammo.length){shake=8;burst(p.x,p.y,'#7af5df',20);sound(120,.2)}charge=0}
function pickUpgrade(){state='upgrade';pulling=false;charge=0;keys.clear();touch={x:0,y:0};choices=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);screen('<div class="tag">LEVEL '+level+'</div><h1>MORE <span>POWER.</span></h1><p>Choose an upgrade. Press 1, 2, or 3.</p><div class="choices">'+choices.map((u,i)=>'<button onclick="choose('+i+')"><b>'+(i+1)+'. '+u[0]+'</b><small>'+u[1]+'</small></button>').join('')+'</div>')}
function choose(i){if(state!=='upgrade'||!choices[i])return;choices[i][2]();state='play';overlay.classList.add('hidden');sound(750)}
function pause(){if(state==='play'){release();state='pause';keys.clear();touch={x:0,y:0};screen('<h1>TAKE A <span>BREATH.</span></h1><p>Your run is paused.</p><button onclick="pause()">Resume →</button>')}else if(state==='pause'){state='play';overlay.classList.add('hidden')}}
function end(){state='over';pulling=false;best=Math.max(best,Math.floor(score));try{localStorage.setItem('magnet-panic-best',best)}catch{}screen('<div class="tag">THE SWARM GOT YOU</div><h1>'+Math.floor(score)+' <span>POINTS</span></h1><p>Survived '+Math.floor(time)+' seconds · '+kills+' robots smashed<br>Level '+level+' · Best '+best+'</p><button onclick="start()">One more round →</button>');sound(90,.35)}
function update(dt){time+=dt;score+=dt*2;p.inv=Math.max(0,p.inv-dt);let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+touch.x,dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+touch.y,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}p.x=Math.max(20,Math.min(W-20,p.x+dx*p.speed*dt));p.y=Math.max(20,Math.min(H-20,p.y+dy*p.speed*dt));if(pulling)charge=Math.min(1,charge+dt*.7*p.coils);spawn-=dt;if(spawn<0){enemy();spawn=Math.max(.19,1.1-time*.009)}supply-=dt;if(supply<0){if(junk.length<65)scrap();supply=.45}let orbit=junk.filter(j=>j.mode==='orbit').length;
for(const j of junk){j.cool=Math.max(0,j.cool-dt);j.a+=dt*j.spin;j.life-=dt;let d=Math.hypot(p.x-j.x,p.y-j.y);if(j.mode==='orbit'){j.a+=dt*3;let radius=39+(j.slot%3)*14;j.x=p.x+Math.cos(j.a)*radius;j.y=p.y+Math.sin(j.a)*radius;j.life=99}else{if(pulling&&d<p.range&&j.mode==='loose'){let nx=(p.x-j.x)/Math.max(1,d),ny=(p.y-j.y)/Math.max(1,d);j.vx+=nx*1100*dt;j.vy+=ny*1100*dt;if(d<65&&orbit<p.capacity){j.mode='orbit';j.slot=orbit++;j.a=Math.atan2(j.y-p.y,j.x-p.x);continue}if(d<22&&orbit>=p.capacity&&p.inv<=0){p.hp-=6;p.inv=.45;burst(p.x,p.y,'#ffb76e');shake=5;j.vx=-nx*280;j.vy=-ny*280}}j.x+=j.vx*dt;j.y+=j.vy*dt;let friction=j.mode==='shot'?1:Math.exp(-dt*.7);j.vx*=friction;j.vy*=friction;if(j.x<8||j.x>W-8){j.vx*=-.8;j.x=Math.max(8,Math.min(W-8,j.x))}if(j.y<8||j.y>H-8){j.vy*=-.8;j.y=Math.max(8,Math.min(H-8,j.y))}}
if(j.mode==='shot'||j.mode==='orbit'&&p.shield){for(const e of enemies){if(e.hp>0&&j.cool<=0&&Math.hypot(e.x-j.x,e.y-j.y)<e.r+7){e.hp-=j.mode==='shot'?j.power:p.shield;j.cool=.22;burst(j.x,j.y,'#fbbb76',5);if(j.mode==='shot'){j.life=0;break}}}}}
for(const e of enemies){e.cool-=dt;let d=Math.hypot(p.x-e.x,p.y-e.y);if(d>1){e.x+=(p.x-e.x)/d*e.speed*dt;e.y+=(p.y-e.y)/d*e.speed*dt}if(d<e.r+17&&p.inv<=0&&e.hp>0){p.hp-=e.heavy?22:12;p.inv=.8;shake=12;burst(p.x,p.y,'#ff647e');sound(80);e.x-=(p.x-e.x)*.4;e.y-=(p.y-e.y)*.4}if(e.hp<=0){kills++;score+=e.heavy?60:25;xp++;burst(e.x,e.y,'#ff647e',18);for(let k=0;k<2;k++){scrap();let j=junk[junk.length-1];j.x=e.x;j.y=e.y}e.dead=true}}
enemies=enemies.filter(e=>!e.dead);junk=junk.filter(j=>j.life>0);for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt}fx=fx.filter(f=>f.life>0).slice(-450);shake*=Math.exp(-dt*14);if(p.hp<=0){end();return}if(xp>=needed){xp-=needed;level++;needed+=5;pickUpgrade()}}
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function draw(){let dpr=Math.min(2,devicePixelRatio||1),cw=canvas.clientWidth,ch=canvas.clientHeight;if(canvas.width!==cw*dpr||canvas.height!==ch*dpr){canvas.width=cw*dpr;canvas.height=ch*dpr}let scale=Math.min(cw/W,ch/H),ox=(cw-W*scale)/2,oy=(ch-H*scale)/2;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080d17';ctx.fillRect(0,0,cw,ch);ctx.translate(ox,oy);ctx.scale(scale,scale);if(p)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#101b2a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1b2b3b';ctx.lineWidth=1;for(let x=0;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#426175';ctx.strokeRect(1,1,W-2,H-2);if(!p)return;if(pulling){circle(p.x,p.y,p.range,'#63ffe509');ctx.strokeStyle='#63ffe53b';ctx.beginPath();ctx.arc(p.x,p.y,p.range,0,7);ctx.stroke();for(let i=0;i<12;i++){let a=i*Math.PI/6+time*.25,r=p.range*(1-(time*.5)%1);circle(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,2,'#7af5df')}}
for(const j of junk){ctx.save();ctx.translate(j.x,j.y);ctx.rotate(j.a);if(j.mode==='shot'){ctx.strokeStyle='#7af5df88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-j.vx*.025,-j.vy*.025);ctx.stroke()}ctx.fillStyle=j.mode==='orbit'?'#7af5df':j.mode==='shot'?'#fff0aa':'#7796ae';ctx.fillRect(-6,-5,12,10);ctx.fillStyle='#192d3d';ctx.fillRect(-2,-2,4,4);ctx.restore()}
for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(p.y-e.y,p.x-e.x));ctx.fillStyle=e.heavy?'#c374e6':e.fast?'#ffbd71':'#ff637d';ctx.beginPath();ctx.roundRect(-e.r,-e.r,e.r*2,e.r*2,5);ctx.fill();ctx.fillStyle='#33162c';ctx.fillRect(2,-e.r*.65,e.r*.7,e.r*1.3);ctx.fillStyle='#fff';ctx.fillRect(e.r*.45,-e.r*.45,4,4);ctx.fillRect(e.r*.45,e.r*.2,4,4);ctx.restore()}
for(const f of fx){ctx.globalAlpha=Math.min(1,f.life*3);circle(f.x,f.y,3,f.c)}ctx.globalAlpha=1;ctx.save();ctx.translate(p.x,p.y);if(p.inv>0&&Math.floor(time*16)%2)ctx.globalAlpha=.4;circle(0,0,22,'#172d42');ctx.strokeStyle=pulling?'#7af5df':'#a1d4e9';ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI);ctx.lineTo(-14,-14);ctx.stroke();ctx.fillStyle='#ff647e';ctx.fillRect(-19,-16,10,12);ctx.fillStyle='#79deff';ctx.fillRect(9,-16,10,12);ctx.restore();ctx.fillStyle='#233948';ctx.fillRect(p.x-26,p.y+32,52,5);ctx.fillStyle=p.hp>30?'#7af5df':'#ff637d';ctx.fillRect(p.x-26,p.y+32,52*Math.max(0,p.hp/p.max),5);ctx.fillStyle='#223948';ctx.fillRect(25,H-28,W-50,6);ctx.fillStyle='#b699ff';ctx.fillRect(25,H-28,(W-50)*xp/needed,6);if(pulling){ctx.fillStyle='#253e4e';ctx.fillRect(W/2-120,H-64,240,12);ctx.fillStyle='#7af5df';ctx.fillRect(W/2-120,H-64,240*charge,12);ctx.fillStyle='#c2e9ee';ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillText(orbitCount()>=p.capacity?'FULL! RELEASE BEFORE LOOSE SCRAP HITS YOU':'RELEASE TO BLAST',W/2,H-74)}stats.textContent='HP '+Math.ceil(Math.max(0,p.hp))+' · LV '+level+' · '+Math.floor(score)+' PTS';record.textContent=Math.floor(time)+'s · Scrap '+orbitCount()+'/'+p.capacity}
function orbitCount(){return junk.filter(j=>j.mode==='orbit').length}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.repeat)return;if(k==='p'||k==='escape')pause();if(state==='upgrade'&&['1','2','3'].includes(k))choose(+k-1);keys.add(k);if(k===' ')hold()});window.addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(e.key===' ')release()});window.addEventListener('blur',()=>{if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});document.getElementById('pause').onclick=pause;let blast=document.getElementById('blast');blast.onpointerdown=e=>{e.preventDefault();blast.setPointerCapture(e.pointerId);hold()};blast.onpointerup=release;blast.onpointercancel=release;
canvas.onpointerdown=e=>{if(state!=='play'||e.clientX>innerWidth*.65)return;stick={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(stick&&e.pointerId===stick.id){touch.x=(e.clientX-stick.x)/55;touch.y=(e.clientY-stick.y)/55;let d=Math.hypot(touch.x,touch.y);if(d>1){touch.x/=d;touch.y/=d}}};function clearStick(e){if(stick?.id===e.pointerId){stick=null;touch={x:0,y:0}}}canvas.onpointerup=clearStick;canvas.onpointercancel=clearStick;menu();requestAnimationFrame(loop);
</script></html>
